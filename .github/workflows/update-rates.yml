name: Update rates

on:
  schedule:
    # Every day at 10:00 UTC (5 AM Eastern in winter, 6 AM in summer).
    - cron: "0 10 * * *"
  # Adds a "Run workflow" button on the Actions tab for same-day updates.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-rates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install -r scraper/requirements.txt

      - name: Read the Affidian rates page
        run: python scraper/fetch_rates.py

      - name: Save the new rates
        run: |
          git config user.name "rates-feed-bot"
          git config user.email "rates-feed-bot@users.noreply.github.com"
          git add docs/rates.json
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "Rates checked $(date -u +'%Y-%m-%d')"
            git push
          fi
